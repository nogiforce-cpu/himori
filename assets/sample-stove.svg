<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <radialGradient id="roomGlow" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#3a2412"/>
      <stop offset="55%" stop-color="#1a1611"/>
      <stop offset="100%" stop-color="#0B0D0A"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3d36"/>
      <stop offset="55%" stop-color="#22241f"/>
      <stop offset="100%" stop-color="#15160f"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c2e28"/>
      <stop offset="100%" stop-color="#171812"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ffdd9e"/>
      <stop offset="35%" stop-color="#D97732"/>
      <stop offset="100%" stop-color="#7a2f0a"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#3a2412" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0B0D0A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="280" fill="url(#roomGlow)"/>

  <!-- 床の敷板(耐火ボード) -->
  <rect x="90" y="238" width="220" height="14" rx="3" fill="#5a5747" stroke="#2e2c22" stroke-width="1.5"/>
  <rect x="70" y="248" width="260" height="10" rx="3" fill="#403e33"/>

  <!-- 床の暖かい反射 -->
  <ellipse cx="200" cy="240" rx="140" ry="26" fill="url(#floorGlow)"/>

  <!-- 煙突(フルーパイプ) -->
  <rect x="248" y="18" width="26" height="90" fill="url(#pipeGrad)" stroke="#0f0f0b" stroke-width="1.5"/>
  <rect x="244" y="12" width="34" height="10" rx="2" fill="#3a3d36" stroke="#0f0f0b" stroke-width="1.5"/>

  <!-- ストーブ本体 -->
  <rect x="120" y="100" width="160" height="120" rx="16" fill="url(#bodyGrad)" stroke="#0f0f0b" stroke-width="2.5"/>
  <!-- 天板のハイライト -->
  <rect x="128" y="104" width="144" height="14" rx="7" fill="#4c4f45" opacity="0.7"/>

  <!-- 脚 -->
  <g stroke="#0f0f0b" stroke-width="2" fill="#26281f">
    <rect x="132" y="218" width="14" height="26" rx="3"/>
    <rect x="254" y="218" width="14" height="26" rx="3"/>
  </g>

  <!-- 前面の窓(炎が見える部分) -->
  <rect x="152" y="132" width="96" height="72" rx="10" fill="#0c0d09" stroke="#0f0f0b" stroke-width="3"/>
  <rect x="160" y="140" width="80" height="56" rx="7" fill="#1a1a13"/>

  <!-- 炎 -->
  <path d="M200 150c6 12-9 13-9 24a9 9 0 0 0 18 0c0-4.5-3-6-3-10.5 5.5 4.5 8.5 11 8.5 18.5a14.5 14.5 0 0 1-29 0c0-11.5 8.5-17 14.5-32z" fill="url(#fireGlow)"/>
  <path d="M184 176c2 6-4 7-4 12.5a4.5 4.5 0 0 0 9 0c0-2-1.2-3-1.2-5 2.4 2 3.7 5 3.7 8.5a6.5 6.5 0 0 1-13 0c0-5 2.7-8.5 5.5-16z" fill="url(#fireGlow)" opacity="0.85"/>

  <!-- ドアの取っ手 -->
  <rect x="248" y="162" width="14" height="8" rx="3" fill="#4c4f45" stroke="#0f0f0b" stroke-width="1.5"/>

  <!-- 通気ダンパーのつまみ -->
  <circle cx="140" cy="118" r="5" fill="#4c4f45" stroke="#0f0f0b" stroke-width="1.5"/>
</svg>
