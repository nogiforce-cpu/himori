<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0D0A">
<title>火守 HIMORI — 火のある暮らしを育てる。</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell" id="app">
  <div class="status"></div>

  <!-- HOME -->
  <section class="screen active" data-tab="home">
    <div class="brand-header leather">
      <button class="iconbtn" id="btn-open-menu" aria-label="メニュー"><svg class="icon" viewBox="0 0 24 24"><use href="#i-menu"/></svg></button>
      <div class="brand-block" style="display:flex;align-items:center;gap:9px">
        <svg viewBox="0 0 240 240" style="width:42px;height:42px;flex-shrink:0"><use href="#logo-badge"/></svg>
        <div>
          <div class="brand-name slab">火守 HIMORI</div>
          <div class="brand-sub">火のある暮らしを育てる。</div>
        </div>
      </div>
      <button class="iconbtn" id="btn-alerts" aria-label="お知らせについて"><svg class="icon" viewBox="0 0 24 24"><use href="#i-info"/></svg></button>
    </div>
    <div class="content">
      <div id="home-banner"></div>

      <!-- 語り口: データより先に、季節や状態に応じたひとことを添える -->
      <div id="home-note" style="margin:0 0 14px;line-height:1.7"></div>

      <!-- 第1階層: 「今、自分がどれだけ薪を準備できているか」を実際の量で見せるカード -->
      <div class="card olive" id="home-season-summary"></div>

      <!-- 第2階層: 毎日の最重要操作 -->
      <button class="btn-primary" id="btn-burn-today"><svg class="icon" viewBox="0 0 24 24"><use href="#i-flame"/></svg>今日、焚いた</button>
      <div class="label-sm" id="home-burn-days" style="text-align:center;margin-top:6px"></div>

      <!-- 薪のある日々: 薪棚写真と、薪づくりの積み重ね -->
      <div class="card" id="home-living" style="margin-top:14px"></div>

      <!-- 第3階層: ときどき行う操作 -->
      <div class="btn-row" style="margin-top:8px">
        <button class="btn-stack" id="btn-go-check"><svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px"><use href="#i-check"/></svg><span>薪棚チェック</span></button>
        <button class="btn-stack" id="btn-open-add"><svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px"><use href="#i-plus"/></svg><span>薪を追加</span></button>
        <button class="btn-stack" id="btn-home-split-log"><img src="assets/icon-axe.png" alt="" style="width:18px;height:18px;object-fit:contain"><span>薪割り</span></button>
      </div>

      <!-- 第4階層: 薪ストーブのある暮らし -->
      <div class="leather" id="home-shelf-ref" style="border-radius:var(--radius);padding:13px;margin-top:14px;margin-bottom:0"></div>
      <div class="leather" id="home-stove" data-action="open-stove-detail" style="border-radius:var(--radius);padding:13px;display:flex;align-items:center;gap:12px;margin-top:10px;margin-bottom:0;cursor:pointer"></div>
      <div class="leather" data-action="open-woodtypes" style="border-radius:var(--radius);padding:12px 13px;display:flex;align-items:center;gap:12px;margin-top:10px;margin-bottom:0;cursor:pointer">
        <div style="width:40px;height:40px;border-radius:8px;background:rgba(154,196,106,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <img src="assets/icon-woodtype.png" alt="" style="width:32px;height:32px;object-fit:contain">
        </div>
        <div id="home-woodtypes" style="flex:1;min-width:0"></div>
        <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--leather-text)"><use href="#i-chevright"/></svg>
      </div>

      <!-- 第5階層: 詳細情報。天気は「薪ストーブ生活の文脈での一言」だけを常時表示し、
           数日分の予報・出典は折りたたみの中に格納する(48時間以内の警戒は上の
           バナーで既に伝えているので、ここでは参考程度の扱いにする) -->
      <div class="label-sm" id="home-weather-context" style="margin-top:16px"></div>
      <button class="link-btn" id="btn-weather-detail-toggle" data-action="toggle-weather-detail" style="padding:4px 0">詳しい天気を見る</button>
      <div id="home-weather-detail" style="display:none">
        <div class="weather-strip" id="home-weather-strip" style="margin-top:6px"></div>
        <div id="home-weather-source" style="margin:8px 0 0"></div>
      </div>
    </div>
  </section>

  <!-- SHELVES -->
  <section class="screen" data-tab="shelves">
    <div class="topbar">
      <span class="title">薪棚一覧</span>
      <div style="display:flex;gap:8px">
        <button class="iconbtn" id="btn-shelves-add" aria-label="新しい薪棚を登録" style="background:var(--olive);color:var(--green)"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-plus"/></svg></button>
      </div>
    </div>
    <div class="content">
      <div class="filter-tabs" id="shelf-filters">
        <button class="active" data-filter="all">すべて</button>
        <button data-filter="乾燥済み">乾燥薪</button>
        <button data-filter="乾燥中">乾燥中</button>
        <button data-filter="来季用">来季用</button>
      </div>
      <div id="shelf-list"></div>
    </div>
  </section>

  <!-- CHECK -->
  <section class="screen" data-tab="check">
    <div class="topbar">
      <button class="iconbtn" id="btn-check-back"><svg class="icon" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <span class="title">薪棚チェック</span>
      <span style="width:44px"></span>
    </div>
    <div class="content">
      <div class="card" id="check-shelf-header"></div>
      <div id="check-body">
        <div class="label-sm" style="margin:14px 0 6px;font-weight:700">最近の変化</div>
        <div class="card" id="check-history"></div>
        <div class="label-sm" style="margin:14px 0 6px;font-weight:700">薪棚の記録(写真)</div>
        <div class="card" id="check-photo-record"></div>
        <div id="check-weather-note" class="factual-note"></div>
        <div class="label-sm" style="margin:14px 0 6px;font-weight:700">今日の薪棚を記録する</div>
        <div class="card" id="checklist"></div>
        <div class="card" id="check-residual"></div>
        <div class="field">
          <label>メモ(任意)</label>
          <textarea class="box" id="check-memo" placeholder="気づいたことがあれば"></textarea>
        </div>
        <div class="field" id="check-moisture-field"></div>
        <button class="btn-primary" id="btn-check-save">薪棚を記録する</button>
      </div>
    </div>
  </section>

  <!-- REVIEW (カレンダー / 週次まとめ) -->
  <section class="screen" data-tab="review">
    <div class="topbar">
      <span class="title" id="review-title">カレンダー</span>
      <button class="btn-ghost" id="btn-split-log" style="flex:none;padding:8px 12px"><img src="assets/icon-axe.png" alt="" style="width:18px;height:18px;object-fit:contain;vertical-align:middle;margin-right:2px">薪割り記録</button>
    </div>
    <div class="content">
      <div class="filter-tabs" id="review-view-tabs">
        <button class="active" data-view="calendar">カレンダー</button>
        <button data-view="weekly">週次まとめ</button>
      </div>

      <div id="review-view-calendar">
        <div class="weekbar">
          <button class="iconbtn" id="btn-cal-prev"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-chevleft"/></svg></button>
          <label class="lbl" style="cursor:pointer">
            <span id="cal-month-label"></span>
            <input type="month" id="cal-month-picker" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden">
          </label>
          <button class="iconbtn" id="btn-cal-next"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-chevright"/></svg></button>
        </div>
        <div class="cal-legend" id="cal-legend"></div>
        <div class="cal-weekdays">
          <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="card" id="cal-month-summary" style="margin-top:14px"></div>
        <div class="label-sm" id="cal-season-note" style="margin-top:10px;line-height:1.7"></div>
      </div>

      <div id="review-view-weekly" style="display:none">
        <div class="weekbar">
          <button class="iconbtn" id="btn-week-prev"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-chevleft"/></svg></button>
          <span class="lbl" id="review-week-label"></span>
          <button class="iconbtn" id="btn-week-next"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-chevright"/></svg></button>
        </div>
        <div class="card" id="review-summary"></div>
        <div class="stat-grid" id="review-stats"></div>
        <div id="review-split-note"></div>
        <div class="card">
          <div class="label-sm" style="margin-bottom:2px;font-weight:700">充足率の推移</div>
          <div class="label-sm" style="margin-bottom:8px">使える薪 ÷ 想定シーズン使用量(ホームの数値と同じもの)</div>
          <svg viewBox="0 0 280 70" style="width:100%;height:70px" id="review-chart"></svg>
        </div>
        <div class="label-sm" style="margin:4px 0 8px;font-weight:700">今週のチェック記録</div>
        <div class="card" id="review-checks" style="margin-bottom:0"></div>
      </div>
    </div>
  </section>

  <!-- ALBUM -->
  <section class="screen" data-tab="album">
    <div class="topbar">
      <span class="title">写真で振り返る</span>
      <button class="iconbtn" id="btn-album-info" aria-label="写真の登録方法について"><svg class="icon" viewBox="0 0 24 24"><use href="#i-info"/></svg></button>
    </div>
    <div class="content">
      <div class="filter-tabs" id="album-filters">
        <button class="active" data-filter="all">すべて</button>
        <button data-filter="薪棚">薪棚</button>
        <button data-filter="ストーブ">ストーブ</button>
        <button data-filter="メンテ">メンテ</button>
        <button data-filter="樹種">樹種</button>
      </div>
      <div id="album-content"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" data-tab="settings">
    <div class="topbar">
      <button class="iconbtn" id="btn-settings-back"><svg class="icon" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <span class="title">設定</span>
      <span style="width:44px"></span>
    </div>
    <div class="content">
      <div class="settings-section">
        <div class="settings-title">プロフィール</div>
        <div class="leather" id="settings-profile" style="border-radius:var(--radius);padding:0 14px;margin-bottom:0"></div>
      </div>
      <div class="settings-section">
        <div class="settings-title">愛機</div>
        <div class="card" id="settings-stove" style="margin-bottom:0"></div>
      </div>
      <div class="settings-section">
        <div class="settings-title">バックアップ・復元</div>
        <p class="label-sm" id="settings-backup-desc" style="margin:0 2px 8px">データはこの端末にしか保存されません。機種変更やブラウザのデータ削除の前に、バックアップを作成しておくと安心です。</p>
        <div class="card" id="settings-backup" style="margin-bottom:0"></div>
      </div>
      <div class="settings-section">
        <div class="settings-title">基本設定</div>
        <div class="card" id="settings-basic" style="margin-bottom:0"></div>
      </div>
      <div class="settings-section">
        <div class="settings-title">サポート</div>
        <div class="card" id="settings-support" style="margin-bottom:0"></div>
      </div>
      <div class="settings-section">
        <div class="settings-title">デモ</div>
        <div class="card" id="settings-demo" style="margin-bottom:0"></div>
      </div>
    </div>
  </section>

  <div class="bottomnav" id="bottomnav"></div>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="menu-overlay">
    <div class="sheet">
      <div class="sheet-title">メニュー</div>
      <div class="sheet-item" id="menu-settings"><svg class="icon" viewBox="0 0 24 24"><use href="#i-settings"/></svg>設定</div>
      <div class="sheet-item" id="menu-woodtypes"><img src="assets/icon-woodtype.png" alt="" style="width:20px;height:20px;object-fit:contain"> 樹種コレクション</div>
      <div class="sheet-item" id="menu-guide"><svg class="icon" viewBox="0 0 24 24"><use href="#i-help"/></svg>使い方ガイド</div>
    </div>
  </div>
  <div id="modal-root"></div>
</div>

    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></symbol>

    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12" y2="8.1"/></symbol>

    <!-- 薪づくり(薪割り・薪追加をまとめて表す): 割った薪の木口を線画で -->
    <symbol id="i-woodwork" viewBox="0 0 24 24"><ellipse cx="7.5" cy="14.5" rx="5" ry="3.8"/><ellipse cx="16.5" cy="11.5" rx="5" ry="3.8"/><line x1="7.5" y1="10.8" x2="7.5" y2="18.2"/><line x1="16.5" y1="7.8" x2="16.5" y2="15.2"/></symbol>
  </defs>
</svg>

<script type="module" src="js/app.js"></script>
</body>
</html>
