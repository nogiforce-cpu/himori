<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0D0A">
<title>火守 / HIMORI — 薪と冬支度ノート</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell" id="app">
  <div class="status"></div>

  <!-- HOME -->
  <section class="screen active" data-tab="home">
    <div class="brand-header leather">
      <button class="iconbtn" id="btn-open-menu"><svg class="icon" viewBox="0 0 24 24"><use href="#i-menu"/></svg></button>
      <div class="brand-block" style="display:flex;align-items:center;gap:9px">
        <svg viewBox="0 0 240 240" style="width:32px;height:32px;flex-shrink:0"><use href="#logo-badge"/></svg>
        <div>
          <div class="brand-name slab">火守</div>
          <div class="brand-sub">HIMORI ― 薪と冬支度ノート</div>
        </div>
      </div>
      <button class="iconbtn" id="btn-alerts"><svg class="icon" viewBox="0 0 24 24"><use href="#i-bell"/></svg></button>
    </div>
    <div class="content">
      <div id="home-banner"></div>
      <div class="weather-strip" id="home-weather-strip"></div>
      <div class="card olive" id="home-recommend" data-action="open-main-shelf-check" style="cursor:pointer"></div>
      <div class="card" id="home-anshin" style="display:flex;gap:14px;align-items:center"></div>
      <div class="label-sm" id="home-season-dates" style="margin:-4px 0 12px;line-height:1.6"></div>

      <button class="btn-primary" id="btn-burn-today"><svg class="icon" viewBox="0 0 24 24"><use href="#i-flame"/></svg>今日、焚いた</button>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn-ghost" id="btn-go-check"><svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px"><use href="#i-check"/></svg>薪棚チェック</button>
        <button class="btn-ghost" id="btn-open-add"><svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px"><use href="#i-plus"/></svg>薪を追加</button>
      </div>

      <div class="card" id="home-note"></div>
      <div class="leather" id="home-stove" data-action="open-maintenance" style="border-radius:var(--radius);padding:13px;display:flex;align-items:center;gap:12px;margin-bottom:0;cursor:pointer"></div>
    </div>
  </section>

  <!-- SHELVES -->
  <section class="screen" data-tab="shelves">
    <div class="topbar">
      <span class="title">薪棚一覧</span>
      <button class="iconbtn" id="btn-shelves-add" style="background:var(--olive);color:var(--green)"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-plus"/></svg></button>
    </div>
    <div class="content">
      <div class="filter-tabs" id="shelf-filters">
        <button class="active" data-filter="all">すべて</button>
        <button data-filter="乾燥済み">乾燥済み</button>
        <button data-filter="乾燥中">乾燥中</button>
        <button data-filter="来季用">来季用</button>
      </div>
      <div id="shelf-list"></div>
    </div>
  </section>

  <!-- CHECK -->
  <section class="screen" data-tab="check">
    <div class="topbar">
      <button class="iconbtn" id="btn-check-back"><svg class="icon" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <span class="title">薪棚チェック記録</span>
      <span style="width:44px"></span>
    </div>
    <div class="content">
      <div class="card" id="check-shelf-header" style="display:flex;gap:12px;align-items:center"></div>
      <div id="check-weather-note" class="factual-note"></div>
      <div class="card" id="checklist"></div>
      <div class="card" id="check-residual"></div>
      <div class="field">
        <label>メモ(任意)</label>
        <textarea class="box" id="check-memo" placeholder="気づいたことがあれば"></textarea>
      </div>
      <div class="field">
        <label>含水率(任意・モイスチャーメーター実測値)</label>
        <div class="box num-field-row"><input class="box" style="padding:0" type="number" id="check-moisture" placeholder="例: 18" min="0" max="60" step="1"><span class="label-sm">%</span></div>
      </div>
      <button class="btn-primary" id="btn-check-save">チェックを記録する</button>
      <div class="label-sm" style="margin:16px 0 8px;font-weight:700">チェック履歴</div>
      <div class="card" id="check-history"></div>
    </div>
  </section>

  <!-- REVIEW (カレンダー / 週次まとめ) -->
  <section class="screen" data-tab="review">
    <div class="topbar">
      <span class="title" id="review-title">カレンダー</span>
      <button class="btn-ghost" id="btn-split-log" style="flex:none;padding:8px 12px"><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#i-axe"/></svg>薪割り記録</button>
    </div>
    <div class="content">
      <div class="filter-tabs" id="review-view-tabs">
        <button class="active" data-view="calendar">カレンダー</button>
        <button data-view="weekly">週次まとめ</button>
      </div>

      <div id="review-view-calendar">
        <div class="weekbar">
          <button class="iconbtn" id="btn-cal-prev"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-chevleft"/></svg></button>
          <span class="lbl" id="cal-month-label"></span>
          <button class="iconbtn" id="btn-cal-next"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-chevright"/></svg></button>
        </div>
        <div class="cal-legend">
          <span><svg class="icon" viewBox="0 0 24 24" style="width:12px;height:12px;color:var(--ember)"><use href="#i-flame"/></svg>焚いた日</span>
          <span><svg class="icon" viewBox="0 0 24 24" style="width:12px;height:12px;color:var(--khaki)"><use href="#i-wrench"/></svg>メンテ</span>
          <span><svg class="icon" viewBox="0 0 24 24" style="width:12px;height:12px;color:var(--muted)"><use href="#i-image"/></svg>写真</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;box-shadow:0 0 0 1.5px var(--red) inset;background:rgba(181,80,46,.12)"></span>チェックで異常</span>
        </div>
        <div class="cal-weekdays">
          <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="card" id="cal-month-summary" style="margin-top:14px"></div>
        <div class="label-sm" id="cal-season-note" style="margin-top:10px;line-height:1.7"></div>
      </div>

      <div id="review-view-weekly" style="display:none">
        <div class="weekbar">
          <button class="iconbtn" id="btn-week-prev"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-chevleft"/></svg></button>
          <span class="lbl" id="review-week-label"></span>
          <button class="iconbtn" id="btn-week-next"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-chevright"/></svg></button>
        </div>
        <div class="card" id="review-summary"></div>
        <div class="stat-grid" id="review-stats"></div>
        <div id="review-split-note"></div>
        <div class="card">
          <div class="label-sm" style="margin-bottom:8px">充足率の推移</div>
          <svg viewBox="0 0 280 70" style="width:100%;height:70px" id="review-chart"></svg>
        </div>
        <div class="label-sm" style="margin:4px 0 8px;font-weight:700">今週のチェック記録</div>
        <div class="card" id="review-checks" style="margin-bottom:0"></div>
      </div>
    </div>
  </section>

  <!-- ALBUM -->
  <section class="screen" data-tab="album">
    <div class="topbar">
      <span class="title">写真アルバム</span>
      <button class="iconbtn" id="btn-album-add" style="background:var(--olive);color:var(--green)"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-plus"/></svg></button>
    </div>
    <div class="content">
      <div class="filter-tabs" id="album-filters">
        <button class="active" data-filter="all">すべて</button>
        <button data-filter="薪棚">薪棚</button>
        <button data-filter="ストーブ">ストーブ</button>
      </div>
      <div id="album-content"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" data-tab="settings">
    <div class="topbar">
      <button class="iconbtn" id="btn-settings-back"><svg class="icon" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <span class="title">設定</span>
      <span style="width:44px"></span>
    </div>
    <div class="content">
      <div class="settings-section">
        <div class="settings-title">プロフィール</div>
        <div class="leather" id="settings-profile" style="border-radius:var(--radius);padding:0 14px;margin-bottom:0"></div>
      </div>
      <div class="settings-section" id="settings-backup-notice-wrap">
        <div class="card" id="settings-backup-notice" style="margin-bottom:0"></div>
      </div>
      <div class="settings-section">
        <div class="settings-title">基本設定</div>
        <div class="card" id="settings-basic" style="margin-bottom:0"></div>
      </div>
      <div class="settings-section">
        <div class="settings-title">サポート</div>
        <div class="card" id="settings-support" style="margin-bottom:0"></div>
      </div>
      <div class="source-notice" id="settings-source-notice"></div>
    </div>
  </section>

  <div class="bottomnav" id="bottomnav"></div>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="menu-overlay">
    <div class="sheet">
      <div class="sheet-title">メニュー</div>
      <div class="sheet-item" id="menu-settings"><svg class="icon" viewBox="0 0 24 24"><use href="#i-settings"/></svg>設定</div>
      <div class="sheet-item" id="menu-woodtypes"><svg class="icon" viewBox="0 0 24 24"><use href="#i-leaf"/></svg>樹種コレクション</div>
      <div class="sheet-item" id="menu-calendar"><svg class="icon" viewBox="0 0 24 24"><use href="#i-calendar"/></svg>カレンダー</div>
      <div class="sheet-item" id="menu-export"><svg class="icon" viewBox="0 0 24 24"><use href="#i-download"/></svg>データ・エクスポート</div>
      <div class="sheet-item" id="menu-guide"><svg class="icon" viewBox="0 0 24 24"><use href="#i-help"/></svg>使い方ガイド・よくある質問</div>
    </div>
  </div>
  <div id="modal-root"></div>
</div>

      <line x1="178" y1="96" x2="178" y2="108" stroke="#F2EAD6" stroke-width="7" stroke-linecap="round"/>

      </g>
      <g>
        <circle cx="90" cy="158" r="16" fill="#8a7350" stroke="#3a2e1c" stroke-width="1.6"/>
        <circle cx="90" cy="158" r="6.5" fill="none" stroke="#3a2e1c" stroke-width="1.4" opacity="0.8"/>

        <circle cx="150" cy="158" r="16" fill="#8a7350" stroke="#3a2e1c" stroke-width="1.6"/>
        <circle cx="150" cy="158" r="6.5" fill="none" stroke="#3a2e1c" stroke-width="1.4" opacity="0.8"/>
      </g>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><polyline points="9 13 11 15 15 10.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><line x1="5" y1="20" x2="5" y2="12"/><line x1="12" y1="20" x2="12" y2="8"/><line x1="19" y1="20" x2="19" y2="15"/><line x1="3" y1="20" x2="21" y2="20"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><polyline points="21 16 15 10 6 20"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><polyline points="4 11 12 4 20 11"/><path d="M6 10v9h12v-9"/></symbol>

    <symbol id="i-back" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 6 5 12 11 18"/></symbol>

    <symbol id="i-axe" viewBox="0 0 24 24"><path d="M13 3l7 7-3 3-7-7z"/><line x1="10" y1="10" x2="4" y2="16"/><path d="M4 16l-1 5 5-1z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12" y2="8.1"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2-2z"/></symbol>
  </defs>
</svg>

<script type="module" src="js/app.js"></script>
</body>
</html>
